name: Tests
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile Python sources
        run: python3 -m compileall -q kit_custom tests
      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Bash syntax
        run: bash -n install.sh bootstrap.sh
      - name: Show pinned version policy
        run: bash install.sh --versions
